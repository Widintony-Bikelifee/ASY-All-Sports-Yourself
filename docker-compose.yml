services:
  # Frontend - Desarrollo
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:80"
    volumes:
      # Montamos tu código directamente en la carpeta donde Nginx lee la web
      - .:/usr/share/nginx/html/:ro
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      # Cambiado a la ruta correcta de Nginx por defecto
      test: ["CMD", "curl", "-f", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - asy-network

networks:
  asy-network:
    driver: bridge