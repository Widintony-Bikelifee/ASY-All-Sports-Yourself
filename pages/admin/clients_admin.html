<!doctype html>
<html lang="es">
  <!-- Page head: meta, fonts, styles / Cabecera: meta, fuentes, estilos -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes – All Sports Yourself</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/sidebar-layout.css" />
    <link rel="stylesheet" href="../../assets/css/admin/clients_admin.css" />
  </head>
  <body class="sidebar-layout">

    
    <!-- Sidebar navigation / Navegación lateral -->
    <aside class="sidebar bg-white shadow-sm d-flex flex-column">
      <div class="sidebar-header p-4 border-bottom text-center">
        <a class="navbar-brand d-flex flex-column align-items-center gap-2 text-decoration-none" href="../../index.html">
          <img src="../../assets/img/Logo-ASY.png" alt="Logo ASY" width="48" height="48" />
          <span class="fw-bold text-dark">All Sports Yourself</span>
        </a>
      </div>

      <div class="sidebar-user p-4 d-flex align-items-center gap-3 border-bottom">
        <img id="sidebar-avatar-img" 
             src="https://ui-avatars.com/api/?name=Usuario&background=2ecc50&color=fff" 
             alt="Avatar" 
             class="rounded-circle" 
             width="48" 
             height="48" />
        <div class="overflow-hidden">
          <div class="fw-semibold text-truncate" id="sidebar-user-name">Cargando...</div>
          <small class="text-muted text-truncate d-block" id="sidebar-user-email">cargando@...</small>
        </div>
      </div>

      <nav class="nav nav-pills flex-column p-3 gap-1 flex-grow-1">
        <a href="./admin-dashboard.html" class="nav-link text-start" id="tab-inicio">
          <i class="bi bi-house-door me-2"></i>Inicio
        </a>
        <a href="./courts_admin.html" class="nav-link text-start" id="tab-canchas">
          <i class="bi bi-geo-alt me-2"></i>Mis Canchas
        </a>
        <a href="./reservations_admin.html" class="nav-link text-start" id="tab-venues">
          <i class="bi bi-calendar-check me-2"></i>Reservas Recibidas
        </a>
        <a href="./clients_admin.html" class="nav-link active text-start" id="tab-clientes">  
          <i class="bi bi-people me-2"></i>Clientes
        </a>
        <a href="./reports_admin.html" class="nav-link text-start" id="tab-reportes">
          <i class="bi bi-bar-chart me-2"></i>Reportes
        </a>
        <a href="./perfil_admin.html" class="nav-link text-start" id="tab-profile">  
          <i class="bi bi-person-circle me-2"></i>Mi Perfil
        </a>
      </nav>

      <div class="p-3 border-top">
        <button class="btn btn-outline-danger w-100" id="btn-logout">
          <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Main content area / Área principal de contenido -->
    <main class="main-content">
      <div class="panel-section active" id="panel-clientes">
        
        <!-- Page header: title and actions / Encabezado: título y acciones -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
          <div>
            <span class="badge rounded-pill py-2 px-3 mb-3" class="clients-title-badge">
              <i class="bi bi-people me-1"></i> Clientes
            </span>
            <h1 class="fw-bold mb-1" class="page-title-heading">
              Mis Clientes
            </h1>
            <p class="text-secondary mb-0">Deportistas que han reservado en tus canchas.</p>
          </div>
          <button onclick="AdminDashboard.loadClientes()" class="btn btn-outline-primary px-4 py-2 fw-semibold shadow-sm">
            <i class="bi bi-arrow-clockwise me-2"></i> Actualizar
          </button>
        </div>

        
        <!-- Search bar / Barra de búsqueda -->
        <div class="mb-4">
          <div class="input-group" style="max-width: 400px;">
            <span class="input-group-text bg-white">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" 
                   id="clientes-search" 
                   class="form-control" 
                   placeholder="Buscar por nombre o correo..." 
                   oninput="AdminDashboard.filterClientes()">
          </div>
        </div>

        
        <!-- Data table: clients list / Tabla de datos: listado de clientes -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold">
              <i class="bi bi-people me-2"></i>Listado de Clientes
            </h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="py-3 ps-4">
                      <i class="bi bi-person me-1"></i> Cliente
                    </th>
                    <th class="py-3">
                      <i class="bi bi-telephone me-1"></i> Teléfono
                    </th>
                    <th class="py-3">
                      <i class="bi bi-calendar-check me-1"></i> Reservas
                    </th>
                    <th class="py-3">
                      <i class="bi bi-clock-history me-1"></i> Última Reserva
                    </th>
                    <th class="py-3 pe-4">
                      <i class="bi ph-star me-1"></i> Cancha Favorita
                    </th>
                    <th class="py-3 pe-4 text-end">
                      <i class="bi bi-eye me-1"></i> Acciones
                    </th>
                  </tr>
                </thead>
                <tbody id="clientes-tbody">
                  <tr>
                    <td colspan="6" class="text-center py-5">
                      <div class="d-flex flex-column align-items-center gap-2 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                          <span class="visually-hidden">Cargando...</span>
                        </div>
                        <span>Cargando clientes…</span>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>

    
    <!-- Toast notifications / Notificaciones toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div class="toast align-items-center border-0" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body d-flex align-items-center gap-2" id="toast-body-content">
            <i class="bi ph-bell"></i>
            <span></span>
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    
    <!-- Page scripts / Scripts de la página -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../../assets/js/services/supabaseClient.js"></script>
    <script src="../../assets/js/services/authService.js"></script>
    <script src="../../assets/js/services/venuesService.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script src="../../assets/js/admin/clients_admin.js"></script>
  </body>
</html>
